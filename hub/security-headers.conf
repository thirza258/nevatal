# Response headers and Link discovery headers for nevatal.id

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://wordpress.nevatal.id https://nevatal.id https://www.nevatal.id; frame-src https://www.youtube.com https://player.vimeo.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# Discovery links for agents (RFC 8288 and RFC 9727 Section 3)
add_header Link '</.well-known/api-catalog>; rel="api-catalog"' always;
add_header Link '<https://chat.nevatal.id/api/v1/>; rel="service-desc"; type="application/json"' always;
add_header Link '</auth.md>; rel="describedby"; type="text/markdown"' always;
add_header Link '</auth.md>; rel="service-doc"; type="text/markdown"' always;
add_header Link '</.well-known/agent-card.json>; rel="agent-card"; type="application/json"' always;
add_header Link '</.well-known/ai-catalog.json>; rel="ai-catalog"' always;
