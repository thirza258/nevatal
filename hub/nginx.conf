# Prefer the scheme the edge reported; fall back to the one we were reached on.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Agents that ask for Markdown get the Markdown rendering of the home page.
map $http_accept $home_doc {
  default         /index.html;
  ~*text/markdown /index.md;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /.well-known/oauth-authorization-server {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /.well-known/openid-configuration {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /.well-known/http-message-signatures-directory {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/security-headers.conf;
    }

    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /auth.md {
        default_type text/markdown;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.md {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.md$ {
        default_type text/markdown;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    # Markdown for Agents: a client that sends Accept: text/markdown gets a
    # Markdown rendering of the home page instead of the app shell.
    location = / {
        default_type text/markdown;
        try_files $home_doc =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        include /etc/nginx/security-headers.conf;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(?:png|svg|ico|webmanifest)$ {
        expires 7d;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
    }
}
