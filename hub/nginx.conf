# Prefer the scheme the edge reported; fall back to the one we were reached on.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Agents that ask for Markdown get the Markdown rendering of the home page.
map $http_accept $home_doc {
  default         /index.html;
  ~*text/markdown /index.md;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Open file descriptor caching for high throughput
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    etag on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/xml
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml
        image/x-icon
        font/opentype
        font/woff
        font/woff2
        application/x-font-ttf;

    # Discovery documents (RFC 9727 linkset, OAuth, OIDC, MCP, Poppy, AI catalogs)
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /.well-known/oauth-authorization-server {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /.well-known/openid-configuration {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /.well-known/http-message-signatures-directory {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    # Crawler and Agent Discovery Documents
    location ~* ^/(?:sitemap\.xml|robots\.txt|llms\.txt|llms-full\.txt)$ {
        default_type text/plain;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /auth.md {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.md {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.md$ {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    # Markdown for Agents: a client that sends Accept: text/markdown gets a
    # Markdown rendering of the home page instead of the app shell.
    location = / {
        default_type text/markdown;
        try_files $home_doc =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        include /etc/nginx/security-headers.conf;
    }

    # Fingerprinted Vite static assets: safe to cache indefinitely
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Project preview screenshots: cache for 30 days with revalidation
    location /previews/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        include /etc/nginx/security-headers.conf;
    }

    # Fonts: immutable long-term caching
    location ~* \.(?:woff|woff2|ttf|otf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Images, icons, and media files
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|ico|svg|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        include /etc/nginx/security-headers.conf;
    }

    # HTML shell: revalidate so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
