services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}  
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    # Deliberately not published. Compose puts every service on the same
    # network, so the backend reaches this as `db:5432` without the port being
    # reachable from outside the host. Publishing it exposed the database to
    # anything that could reach this machine. Add `ports` back locally only if
    # you need a GUI client attached, and never on a public host.
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: nevatal_backend
    command: /app/entrypoint.sh
    volumes:
      - ./backend:/app
    # Also not published: reaching Django directly would bypass nginx, and with
    # it the request size limit and the security headers. The frontend proxies
    # /api/ to `backend:8000` over the compose network. Uncomment for local
    # debugging if you need it.
    # ports:
    #   - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DEVELOPMENT_MODE=${DEVELOPMENT_MODE}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nevatal_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: