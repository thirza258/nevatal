name: Build, Test and Deploy Nevatal

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# One production deployment at a time. A second push waits for the first deploy
# to finish instead of racing it and starting containers from an older build.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend
        env:
          DEVELOPMENT_MODE: "True"
          SECRET_KEY: "ci-test-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEF"
        run: python manage.py test

  frontend-tests:
    name: ${{ matrix.project }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        project: [ frontend, hub ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: npm test

  build:
    name: Build ${{ matrix.name }} image
    needs: [ backend-tests, frontend-tests ]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: nevatal-backend
          - name: frontend
            context: ./frontend
            image: nevatal-frontend
          - name: hub
            context: ./hub
            image: nevatal-hub

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Cloudflared
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Copy deploy script to the server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o ProxyCommand="/usr/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}" \
            deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:deploy.sh

      - name: Deploy via SSH
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o ProxyCommand="/usr/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}" \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'REMOTE_SCRIPT'

          set -euo pipefail

          echo "=== CONNECTED TO SERVER ==="
          whoami
          hostname

          mkdir -p ~/nevatal_app
          mv ~/deploy.sh ~/nevatal_app/deploy.sh
          chmod +x ~/nevatal_app/deploy.sh

          # Preserve existing valid SECRET_KEY and API_KEY_FINGERPRINT_SALT
          # from the server so redeploys do not invalidate sessions or disconnect
          # chat history if they were not set as GitHub Secrets.
          EXISTING_SECRET_KEY=""
          EXISTING_SALT=""
          if [ -f ~/nevatal_app/.env ]; then
            RAW_EXISTING=$(sed -n "s/^SECRET_KEY=//p" ~/nevatal_app/.env | tail -n 1)
            RAW_EXISTING="${RAW_EXISTING%\"}"
            RAW_EXISTING="${RAW_EXISTING#\"}"
            case "$RAW_EXISTING" in
              SecretKey|django-insecure-*|changeme|secret|"")
                ;;
              *)
                if [ "${#RAW_EXISTING}" -ge 50 ]; then
                  EXISTING_SECRET_KEY="$RAW_EXISTING"
                fi
                ;;
            esac
            EXISTING_SALT=$(sed -n "s/^API_KEY_FINGERPRINT_SALT=//p" ~/nevatal_app/.env | tail -n 1)
          fi

          # Config for both Compose and deploy.sh. Quoted heredoc: a secret
          # containing $ reaches the file intact. Optional settings fall back
          # to the safe defaults already baked into deploy.sh.
          cat > ~/nevatal_app/.env <<'EOF'
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DEVELOPMENT_MODE=${{ secrets.DEVELOPMENT_MODE }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG=${{ github.sha }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          API_KEY_FINGERPRINT_SALT=${{ secrets.API_KEY_FINGERPRINT_SALT }}
          CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
          DEBUG=${{ secrets.DEBUG || 'False' }}
          ANON_THROTTLE_RATE=${{ secrets.ANON_THROTTLE_RATE || '180/min' }}
          NUM_PROXIES=${{ secrets.NUM_PROXIES || '2' }}
          SECURE_SSL_REDIRECT=${{ secrets.SECURE_SSL_REDIRECT || 'False' }}
          SECURE_HSTS_SECONDS=${{ secrets.SECURE_HSTS_SECONDS || '0' }}
          SCHEMA_PUBLIC=${{ secrets.SCHEMA_PUBLIC || 'False' }}
          EOF

          # Ensure SECRET_KEY is set and meets security requirements (>= 50 chars,
          # not placeholder): GitHub secret > existing server key > auto-generated.
          CURRENT_SECRET_KEY=$(sed -n "s/^SECRET_KEY=//p" ~/nevatal_app/.env | tail -n 1)
          CURRENT_SECRET_KEY="${CURRENT_SECRET_KEY%\"}"
          CURRENT_SECRET_KEY="${CURRENT_SECRET_KEY#\"}"
          case "$CURRENT_SECRET_KEY" in
            SecretKey|django-insecure-*|changeme|secret|"")
              CURRENT_SECRET_KEY=""
              ;;
            *)
              if [ "${#CURRENT_SECRET_KEY}" -lt 50 ]; then
                CURRENT_SECRET_KEY=""
              fi
              ;;
          esac

          if [ -z "$CURRENT_SECRET_KEY" ]; then
            if [ -n "$EXISTING_SECRET_KEY" ]; then
              FINAL_KEY="$EXISTING_SECRET_KEY"
            else
              FINAL_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))' 2>/dev/null || openssl rand -base64 48 | tr -dc 'a-zA-Z0-9_-')
            fi
            sed -i '/^SECRET_KEY=/d' ~/nevatal_app/.env
            printf 'SECRET_KEY=%s\n' "$FINAL_KEY" >> ~/nevatal_app/.env
          fi

          CURRENT_SALT=$(sed -n "s/^API_KEY_FINGERPRINT_SALT=//p" ~/nevatal_app/.env | tail -n 1)
          if [ -z "$CURRENT_SALT" ] && [ -n "$EXISTING_SALT" ]; then
            sed -i '/^API_KEY_FINGERPRINT_SALT=/d' ~/nevatal_app/.env
            printf 'API_KEY_FINGERPRINT_SALT=%s\n' "$EXISTING_SALT" >> ~/nevatal_app/.env
          fi

          # Never print .env — it holds the database password.
          echo "=== ENV CREATED ($(wc -l < ~/nevatal_app/.env) keys) ==="

          ~/nevatal_app/deploy.sh

          REMOTE_SCRIPT
