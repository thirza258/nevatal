name: Build and Deploy Nevatal

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & push backend
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nevatal-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/nevatal-backend:${{ github.sha }}

      # Build & push frontend
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nevatal-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/nevatal-frontend:${{ github.sha }}

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Copy deploy script to the server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o ProxyCommand="/usr/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}" \
            deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:deploy.sh

      - name: Deploy via SSH
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o ProxyCommand="/usr/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}" \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'REMOTE_SCRIPT'

          set -euo pipefail

          echo "=== CONNECTED TO SERVER ==="
          whoami
          hostname

          mkdir -p ~/nevatal_app
          mv ~/deploy.sh ~/nevatal_app/deploy.sh
          chmod +x ~/nevatal_app/deploy.sh

          # Preserve existing valid SECRET_KEY and API_KEY_FINGERPRINT_SALT
          # from the server so redeploys do not invalidate sessions or disconnect
          # chat history if they were not set as GitHub Secrets.
          EXISTING_SECRET_KEY=""
          EXISTING_SALT=""
          if [ -f ~/nevatal_app/.env ]; then
            RAW_EXISTING=$(sed -n "s/^SECRET_KEY=//p" ~/nevatal_app/.env | tail -n 1)
            RAW_EXISTING="${RAW_EXISTING%\"}"
            RAW_EXISTING="${RAW_EXISTING#\"}"
            case "$RAW_EXISTING" in
              SecretKey|django-insecure-*|changeme|secret|"")
                ;;
              *)
                if [ "${#RAW_EXISTING}" -ge 50 ]; then
                  EXISTING_SECRET_KEY="$RAW_EXISTING"
                fi
                ;;
            esac
            EXISTING_SALT=$(sed -n "s/^API_KEY_FINGERPRINT_SALT=//p" ~/nevatal_app/.env | tail -n 1)
          fi

          # Config for both Compose and deploy.sh. Quoted heredoc: a secret
          # containing $ reaches the file intact.
          cat > ~/nevatal_app/.env <<'EOF'
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DEVELOPMENT_MODE=${{ secrets.DEVELOPMENT_MODE }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG=${{ github.sha }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          API_KEY_FINGERPRINT_SALT=${{ secrets.API_KEY_FINGERPRINT_SALT }}
          CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
          EOF

          # Ensure SECRET_KEY is set and meets security requirements (>= 50 chars,
          # not placeholder): GitHub secret > existing server key > auto-generated.
          CURRENT_SECRET_KEY=$(sed -n "s/^SECRET_KEY=//p" ~/nevatal_app/.env | tail -n 1)
          CURRENT_SECRET_KEY="${CURRENT_SECRET_KEY%\"}"
          CURRENT_SECRET_KEY="${CURRENT_SECRET_KEY#\"}"
          case "$CURRENT_SECRET_KEY" in
            SecretKey|django-insecure-*|changeme|secret|"")
              CURRENT_SECRET_KEY=""
              ;;
            *)
              if [ "${#CURRENT_SECRET_KEY}" -lt 50 ]; then
                CURRENT_SECRET_KEY=""
              fi
              ;;
          esac

          if [ -z "$CURRENT_SECRET_KEY" ]; then
            if [ -n "$EXISTING_SECRET_KEY" ]; then
              FINAL_KEY="$EXISTING_SECRET_KEY"
            else
              FINAL_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))' 2>/dev/null || openssl rand -base64 48 | tr -dc 'a-zA-Z0-9_-')
            fi
            sed -i '/^SECRET_KEY=/d' ~/nevatal_app/.env
            printf 'SECRET_KEY=%s\n' "$FINAL_KEY" >> ~/nevatal_app/.env
          fi

          CURRENT_SALT=$(sed -n "s/^API_KEY_FINGERPRINT_SALT=//p" ~/nevatal_app/.env | tail -n 1)
          if [ -z "$CURRENT_SALT" ] && [ -n "$EXISTING_SALT" ]; then
            sed -i '/^API_KEY_FINGERPRINT_SALT=/d' ~/nevatal_app/.env
            printf 'API_KEY_FINGERPRINT_SALT=%s\n' "$EXISTING_SALT" >> ~/nevatal_app/.env
          fi

          # Never print .env — it holds the database password.
          echo "=== ENV CREATED ($(wc -l < ~/nevatal_app/.env) keys) ==="

          ~/nevatal_app/deploy.sh

          REMOTE_SCRIPT
