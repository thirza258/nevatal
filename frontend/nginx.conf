# Prefer the scheme the edge reported; fall back to the one we were reached on.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Agents that ask for Markdown get the Markdown rendering of the home page.
map $http_accept $home_doc {
  default         /index.html;
  ~*text/markdown /index.md;
}

server {
  listen 80;

  root   /usr/share/nginx/html;
  index  index.html;

  include /etc/nginx/security-headers.conf;

  # The app checks uploads itself and reports a readable error; this is the
  # outer bound, set a little above the app's own 10 MB so that a file just
  # over the line gets that message rather than an opaque nginx 413.
  client_max_body_size 12m;

  # Don't advertise the exact nginx version to anyone scanning.
  server_tokens off;

  # Page speed feeds into search ranking, and the bundle is the biggest thing
  # a first-time visitor downloads.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/xml
    application/javascript
    application/json
    image/svg+xml;

  # Discovery documents are real files, not SPA routes. The extensionless
  # documents get explicit media types; everything else uses its file type.
  location = /.well-known/api-catalog {
    default_type application/linkset+json;
    try_files $uri =404;
    add_header Access-Control-Allow-Origin "*" always;
    include /etc/nginx/security-headers.conf;
  }

  location /.well-known/ {
    default_type application/json;
    try_files $uri =404;
    add_header Access-Control-Allow-Origin "*" always;
    include /etc/nginx/security-headers.conf;
  }

  location = /auth.md {
    default_type text/markdown;
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
  }

  location = /index.md {
    default_type text/markdown;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Vary "Accept" always;
    include /etc/nginx/security-headers.conf;
  }

  # nginx does not ship a .md mapping, so set it explicitly for every Markdown
  # document, including skills nested under .well-known.
  location ~* \.md$ {
    default_type text/markdown;
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
  }

  # Markdown for Agents: a client that sends Accept: text/markdown gets a
  # Markdown rendering of the home page instead of the app shell.
  location = / {
    default_type text/markdown;
    try_files $home_doc =404;
    add_header Cache-Control "no-cache" always;
    add_header Vary "Accept" always;
    include /etc/nginx/security-headers.conf;
  }

  # Vite fingerprints everything it emits under /assets, so those URLs never
  # change meaning.
  # `expires` would emit a second, weaker Cache-Control alongside this one.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # index.html is not fingerprinted and is what points at the current bundle;
  # caching it would pin returning visitors to an old build.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # The service worker decides what the browser caches, so it must never be a
  # cached file itself: a stale worker would keep serving a stale shell.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # Public lessons are emitted as real HTML at build time, including their
  # metadata. Unknown course URLs must return 404 instead of the app shell.
  location = /courses {
    try_files /courses/index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  location /courses/ {
    try_files $uri/index.html $uri =404;
    error_page 404 /404.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  location = /about {
    try_files /about/index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  location = /about/ {
    return 301 /about;
  }

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Django decides whether a request was secure — and so whether to
        # honour a Secure cookie — from this header. TLS ends at the tunnel in
        # front of us, so pass on what it said and fall back to our own scheme
        # when nothing did. Without this, request.is_secure() is always False.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
