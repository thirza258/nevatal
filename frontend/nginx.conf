# Prefer the scheme the edge reported; fall back to the one we were reached on.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;

  root   /usr/share/nginx/html;
  index  index.html;

  include /etc/nginx/security-headers.conf;

  # The app checks uploads itself and reports a readable error; this is the
  # outer bound, set a little above the app's own 10 MB so that a file just
  # over the line gets that message rather than an opaque nginx 413.
  client_max_body_size 12m;

  # Don't advertise the exact nginx version to anyone scanning.
  server_tokens off;

  # Page speed feeds into search ranking, and the bundle is the biggest thing
  # a first-time visitor downloads.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/xml
    application/javascript
    application/json
    image/svg+xml;

  # Vite fingerprints everything it emits under /assets, so those URLs never
  # change meaning.
  # `expires` would emit a second, weaker Cache-Control alongside this one.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # index.html is not fingerprinted and is what points at the current bundle;
  # caching it would pin returning visitors to an old build.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # The service worker decides what the browser caches, so it must never be a
  # cached file itself: a stale worker would keep serving a stale shell.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Django decides whether a request was secure — and so whether to
        # honour a Secure cookie — from this header. TLS ends at the tunnel in
        # front of us, so pass on what it said and fall back to our own scheme
        # when nothing did. Without this, request.is_secure() is always False.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
