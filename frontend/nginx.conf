server {
  listen 80;

  root   /usr/share/nginx/html;
  index  index.html;

  # Page speed feeds into search ranking, and the bundle is the biggest thing
  # a first-time visitor downloads.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/xml
    application/javascript
    application/json
    image/svg+xml;

  # Vite fingerprints everything it emits under /assets, so those URLs never
  # change meaning.
  # `expires` would emit a second, weaker Cache-Control alongside this one.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html is not fingerprinted and is what points at the current bundle;
  # caching it would pin returning visitors to an old build.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The service worker decides what the browser caches, so it must never be a
  # cached file itself: a stale worker would keep serving a stale shell.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
