<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Every route serves this file, and every signed-out URL resolves to the
      landing page, so these tags describe the landing page. The canonical URL
      below is repeated in public/robots.txt and public/sitemap.xml; changing
      the domain means changing all three.
    -->
    <title>Nevatal — AI Tools Hub for Your Own OpenAI, Gemini or OpenRouter Key</title>
    <meta
      name="description"
      content="An open source AI tools hub: writing, translation, summarising, document Q&amp;A and image generation, all running on your own OpenAI, Gemini or OpenRouter API key."
    />
    <link rel="canonical" href="https://chat.nevatal.tech/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#111827" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Installable on a phone: the manifest names the app, the icons and the
         standalone display mode. The service worker is registered from
         main.tsx, in production builds only. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nevatal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      Inter, requested from the document rather than with an @import inside
      index.css. An @import cannot start until the stylesheet that contains it
      has downloaded and parsed, which put three round trips in front of the
      first paint — HTML, then CSS, then the font CSS, then the font files.
      From here the font CSS is fetched in parallel with our own.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nevatal" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://chat.nevatal.tech/" />
    <meta property="og:title" content="Nevatal — AI Tools Hub for Your Own OpenAI, Gemini or OpenRouter Key" />
    <meta
      property="og:description"
      content="Seventeen focused AI tools behind one interface. Bring your own provider key: it is encrypted before it leaves the browser and never stored in browser storage."
    />
    <meta property="og:image" content="https://chat.nevatal.tech/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nevatal" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nevatal — AI Tools Hub for Your Own API Key" />
    <meta
      name="twitter:description"
      content="Seventeen focused AI tools behind one interface, running on your own OpenAI, Gemini or OpenRouter key. Open source and self-hostable."
    />
    <meta name="twitter:image" content="https://chat.nevatal.tech/og-image.png" />

    <!--
      Structured data for the stable facts about the product. The FAQ markup is
      generated by the landing page component from the same array it renders,
      so it is not duplicated here.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://chat.nevatal.tech/#website",
            "url": "https://chat.nevatal.tech/",
            "name": "Nevatal",
            "description": "An open source AI tools hub that runs on your own provider API key.",
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://chat.nevatal.tech/#app",
            "name": "Nevatal",
            "url": "https://chat.nevatal.tech/",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "AI writing and document tools",
            "operatingSystem": "Any (web browser)",
            "browserRequirements": "Requires JavaScript and a provider API key",
            "description": "Nevatal puts seventeen focused AI tools behind one interface: prompting, explaining, writing, rewriting, proofreading, summarising, copywriting, email drafting, social captions, idea generation, translation, sentiment analysis, document Q&A, image generation, CSV data analysis, data formatting and batch runs. Requests are made with the user's own OpenAI, Google Gemini or OpenRouter API key.",
            "featureList": [
              "Prompt",
              "Explainer",
              "Writer",
              "Rewriter",
              "Proofreader",
              "Summarizer",
              "Copywriting",
              "Email Builder",
              "Social Caption",
              "Idea Generator",
              "Translator",
              "Sentiment Analysis",
              "Document AI",
              "Image Generation",
              "Data Analysis",
              "Data Formatter",
              "Batch Runner"
            ],
            "license": "https://opensource.org/licenses/MIT",
            "isAccessibleForFree": true,
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "description": "Free and open source. Usage is billed by your AI provider against your own API key."
            },
            "codeRepository": "https://github.com/thirza258/nevatal",
            "image": "https://chat.nevatal.tech/og-image.png"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- The only copy a crawler without JavaScript will see. -->
    <noscript>
      <h1>Nevatal — AI tools that run on your own API key</h1>
      <p>
        Nevatal is an open source workspace that puts seventeen focused AI
        tools behind one interface. You bring an API key from OpenAI, Google Gemini or
        OpenRouter, and every request is made with that key: there is no
        subscription and no account to create.
      </p>
      <p>
        The tools are Prompt, Explainer, Writer, Rewriter, Proofreader,
        Summarizer, Copywriting, Email Builder, Social Caption, Idea Generator,
        Translator, Sentiment Analysis, Document AI, Image Generation, Data
        Analysis, Data Formatter and Batch Runner.
      </p>
      <p>
        Nevatal needs JavaScript to run. The source is available at
        <a href="https://github.com/thirza258/nevatal">github.com/thirza258/nevatal</a>.
      </p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
