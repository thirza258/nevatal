# Response headers that harden every document this server hands out.
#
# This lives in its own file because nginx does not inherit `add_header` into a
# location that sets one of its own: the cache-control locations below would
# silently lose every header set at the server level. So it is included once
# per level that adds a header, which is the only way to be sure the app shell
# and the bundle get them too.

# The bundle is same-origin, images arrive as data: URIs from the API, and the
# only third party is Google Fonts (pulled in by an @import in the stylesheet,
# so it needs style-src as well as font-src). Inline styles are allowed because
# React writes style attributes; inline *scripts* are not, which is the half
# that matters for XSS. The JSON-LD block in index.html is a non-executable
# script type and is unaffected.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Belt and braces with frame-ancestors above, for anything that predates CSP.
add_header X-Frame-Options "DENY" always;

# Stops a response being reinterpreted as a type it did not declare, which is
# how an upload echoed back can turn into script.
add_header X-Content-Type-Options "nosniff" always;

# Referrers leak which tool a user was on to any outbound link.
add_header Referrer-Policy "same-origin" always;

# None of these are used, so none of them should be available to a compromised
# script or an embedded frame.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Keeps this page out of a shared browsing-context group with anything that
# opens it, so a cross-origin opener cannot reach into it.
add_header Cross-Origin-Opener-Policy "same-origin" always;
